# Unattended ingest: Gmail bank alerts -> YNAB (unapproved). Runs hourly.
# A non-zero exit (no alerts at all, API failure, or an item that could NOT be handed to a human)
# fails the run, and GitHub emails the repo owner about failed scheduled runs. Items that need a
# human become a `needs-review` GitHub issue plus one push (once each); HEALTHCHECK_URL is the
# external dead-man's switch that notices when this workflow stops running at all.
#
# NOTE: this repo is public, so the logs are public — the job prints only counts and ids.
# NOTE: GitHub disables scheduled workflows after 60 days without repo activity; re-enable
# from the Actions tab (or push any commit) if that ever happens.
name: ingest

on:
  schedule:
    # Minute 23, off the top-of-hour rush. A commit that changes the cron line is also the
    # documented way to make GitHub re-register a schedule that never started firing.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Hours of Gmail history to re-read (72 normally; 336 to recover after a long outage)"
        required: false
        default: "72"
        type: string

permissions:
  contents: read
  # Opens/closes the `needs-review` issues (the review queue).
  issues: write

# Never run two ingests at once; let a running one finish (queued run waits).
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ingest
        env:
          YNAB_PAT: ${{ secrets.YNAB_PAT }}
          YNAB_BUDGET_ID: ${{ secrets.YNAB_BUDGET_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ACCOUNT_REGISTRY_JSON: ${{ secrets.ACCOUNT_REGISTRY_JSON }}
          CATEGORY_RULES_JSON: ${{ secrets.CATEGORY_RULES_JSON }}
          SMS_FORWARD_FROM: ${{ secrets.SMS_FORWARD_FROM }}
          # Empty on scheduled runs, so fall back to the default window.
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '72' }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
